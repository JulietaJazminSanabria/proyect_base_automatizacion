name: Postman Regression - Grupo 07 Carrito

on:
  push:
    branches: ["main"]
    paths:
      - "postman/grupo-07-carrito-ecommerce.postman_collection.json"
      - ".github/workflows/postman-grupo07-regression.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "postman/grupo-07-carrito-ecommerce.postman_collection.json"
      - ".github/workflows/postman-grupo07-regression.yml"
  workflow_dispatch:

jobs:
  newman-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar regresión Postman (Newman) - Grupo 07
        run: >
          npx newman run postman/grupo-07-carrito-ecommerce.postman_collection.json
          --env-var "baseUrl=${{ vars.GRUPO07_BASE_URL }}"
          --env-var "apiKey=${{ secrets.GRUPO07_API_KEY }}"
          --delay-request 500
          --reporters cli,junit,htmlextra
          --reporter-junit-export newman/report.xml
          --reporter-htmlextra-export newman/report.html
          --reporter-htmlextra-title "Grupo 07 - Regresion Carrito"

      - name: Instalar Chromium (Playwright) para exportar PDF
        if: always()
        run: npx playwright install --with-deps chromium

      - name: Generar PDF del reporte Newman
        if: always()
        run: node scripts/newman-html-to-pdf.mjs newman/report.html newman/report.pdf

      - name: Subir reporte Newman (JUnit, HTML, PDF)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report-grupo07
          path: |
            newman/report.xml
            newman/report.html
            newman/report.pdf
          retention-days: 7
